<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b07d2b">
<title>Crea tu barbería · App de reservas</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">

<link rel="stylesheet" href="../shared/core.css">

<style>
  .reg { max-width: 460px; margin: 4vh auto 0; }
  .hero { text-align: center; padding: 24px 20px; }
  .hero .logo-grande { width: 84px; height: 84px; border-radius: 26px; margin: 0 auto 12px; display: grid; place-items: center; font-size: 42px;
    background: linear-gradient(135deg, var(--brand), color-mix(in srgb, var(--brand) 50%, #000)); color: var(--brand-ink); background-size: cover; background-position: center; }
  .hero h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.02em; }
  .ventajas { margin: 12px 0 0; padding: 0; list-style: none; text-align: left; display: grid; gap: 6px; font-size: 15px; }
  #cargando { text-align: center; margin-top: 30vh; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div id="cargando">💈 Cargando…</div>
  <div id="app" class="reg hidden"></div>
</main>
<script src="../shared/config.js"></script>
<script src="../shared/vendor/supabase.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/cuenta.js"></script>

</body>
</html>
