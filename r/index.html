<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b07d2b">
<meta name="robots" content="noindex, nofollow">
<title>Tu reserva</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../shared/core.css">
<link rel="stylesheet" href="../shared/tema.css">
<style>
  body { padding-bottom: 90px; }
  .portada { height: 140px; border-radius: var(--radius); background: var(--brand-soft) center / cover no-repeat; margin-bottom: 14px; box-shadow: var(--shadow); }
  .hero { text-align: center; padding: 22px 18px; }
  .hero .logo-grande { width: 84px; height: 84px; border-radius: 26px; margin: 0 auto 12px; display: grid; place-items: center; font-size: 42px;
    background: linear-gradient(135deg, var(--brand), color-mix(in srgb, var(--brand) 50%, #000)); color: var(--brand-ink); background-size: cover; background-position: center; }
  .hero .logo-grande.img { background-color: #fff; box-shadow: 0 0 0 1px var(--line); }
  .hero h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -.02em; }
  .paso { display: flex; align-items: center; gap: 10px; margin: 18px 4px 10px; }
  .paso .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: var(--brand-ink); font-weight: 800; font-size: 14px; flex: none; }
  .paso b { font-size: 16px; }
  .resumen-carro { display: grid; gap: 4px; font-size: 15px; }
  .resumen-carro div { display: flex; justify-content: space-between; gap: 10px; }
  .oferta img { width: 100%; border-radius: 12px; margin-top: 8px; display: block; }
  #cargando { text-align: center; margin-top: 30vh; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div id="cargando">💈 Cargando…</div>
  <div id="app" class="hidden"></div>
</main>

<script src="../shared/config.js"></script>
<script src="../shared/vendor/supabase.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/cuenta.js"></script>
<script src="../shared/agenda.js"></script>
<script src="r.js"></script>
<script src="../shared/iconos.js"></script>
<script src="../shared/instalar.js"></script>
<script src="../shared/barra.js"></script>
<script src="../shared/auto.js"></script>
<script src="../shared/fotos.js"></script>
<script src="../shared/voz.js"></script>
<script src="../shared/respaldo.js"></script>
</body>
</html>
