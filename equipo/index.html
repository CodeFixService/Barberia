<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b07d2b">
<meta name="robots" content="noindex, nofollow">
<title>Panel de la barbería</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../shared/core.css">
<style>
  main { max-width: 1100px; }
  .barra-cal { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .barra-cal .fecha-tit { flex: 1; min-width: 140px; font-weight: 750; text-align: center; }
  .pend { border-left: 4px solid var(--consultar); }
  .menu-mas { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .menu-mas button { flex-direction: column; align-items: flex-start; gap: 4px; padding: 16px; border-radius: 18px; background: var(--card); color: var(--text);
    border: 1px solid var(--line); box-shadow: var(--shadow); text-align: left; font-weight: 700; min-height: 96px; }
  .menu-mas button span { font-size: 26px; }
  .menu-mas button small { font-weight: 500; color: var(--muted); font-size: 12.5px; }
  .horario-dia { display: grid; grid-template-columns: 82px 1fr; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .horario-dia:last-child { border-bottom: 0; }
  .horario-dia .hs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .horario-dia input, .horario-dia select { padding: 9px 10px; font-size: 14.5px; }
  .horario-dia .hs.cerrado { display: none; }
  .durs { display: flex; gap: 6px; flex-wrap: wrap; }
  .qr-img { width: 220px; max-width: 70%; display: block; margin: 10px auto; border-radius: 12px; }
  .det-fila { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .det-fila:last-child { border-bottom: 0; }
  .orden button { padding: 4px 8px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <section class="view" id="v-hoy"></section>
  <section class="view" id="v-agenda"></section>
  <section class="view" id="v-caja"></section>
  <section class="view" id="v-chat"></section>
  <section class="view" id="v-mas"></section>
</main>
<nav class="tabs">
  <button data-v="hoy" class="on"><span>🏠</span>Hoy<i class="num" data-num="pendientes"></i></button>
  <button data-v="agenda"><span>📅</span>Agenda</button>
  <button data-v="caja"><span>💵</span>Caja</button>
  <button data-v="chat"><span>💬</span>Mensajes<i class="num" data-num="mensajes"></i></button>
  <button data-v="mas"><span>☰</span>Más</button>
</nav>
<script src="../shared/config.js"></script>
<script src="../shared/vendor/supabase.js"></script>
<script src="../shared/vendor/qrcode.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/cuenta.js"></script>
<script src="../shared/avisos.js"></script>
<script src="../shared/chat.js"></script>
<script src="../shared/agenda.js"></script>
<script src="../shared/perfil.js"></script>
<script src="equipo.js"></script>
</body>
</html>
